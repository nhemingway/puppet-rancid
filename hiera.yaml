---
version: 4
datadir: 'data'
hierarchy:
  - name: "codename"
    path: "os/%{facts.os.name}/%{facts.os.distro.codename}.yaml"
    backend: yaml
  - name: "name"
    path: "os/%{facts.os.name}.yaml"
    backend: yaml
  - name: "family"
    path: "os/%{facts.os.family}.yaml"
    backend: yaml
  - name: "common"
    backend: yaml
    path: "common.yaml"

